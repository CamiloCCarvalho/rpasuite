[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpa_suite"
version = "1.9.0"
description = "Comprehensive Python toolkit for RPA automation: email, logging, database tracking, browser automation, OCR, desktop automation, and more. Essential utilities for building robust automation workflows with Selenium, Botcity, and custom solutions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Camilo Costa de Carvalho", email = "camilo.costa1993@gmail.com" }
]
requires-python = ">=3.11"
keywords = [
    "rpa",
    "automation",
    "selenium",
    "logging",
    "database",
    "sqlite",
    "postgresql",
    "mysql",
    "sqlserver",
    "ocr",
    "pyautogui",
    "email",
    "browser-automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Communications :: Email",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
    "colorama",
    "email_validator",
    "loguru",
    "pillow",
    "pyautogui",
    "requests",
]

[project.optional-dependencies]
browser = [
    "selenium>=4.16.0",
    "webdriver-manager>=4.0.1",
]
ocr = [
    "docling",
]
dashboard = [
    "flask>=3.0.0",
]
opencv = [
    "opencv-python",
]
postgres = [
    "psycopg2-binary",
]
mysql = [
    "mysql-connector-python",
]
sqlserver = [
    "pyodbc",
]
dev = [
    "build",
    "twine",
    "pre-commit",
    "black",
    "pylint",
    "bandit",
    "pyupgrade",
    "detect-secrets",
    "flake8",
    "isort",
]
all = [
    "selenium>=4.16.0",
    "webdriver-manager>=4.0.1",
    "docling",
    "flask>=3.0.0",
    "opencv-python",
    "psycopg2-binary",
    "mysql-connector-python",
    "pyodbc",
]

[project.urls]
Homepage = "https://github.com/CamiloCCarvalho/rpasuite"
Documentation = "https://github.com/CamiloCCarvalho/rpasuite/wiki"
Source = "https://github.com/CamiloCCarvalho/rpasuite"
Tracker = "https://github.com/CamiloCCarvalho/rpasuite/issues"
LinkedIn = "https://www.linkedin.com/in/camilocostac/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rpa_suite*"]

[tool.setuptools.package-data]
"rpa_suite.core.dashboard" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.black]
line-length = 120

[tool.pylint.FORMAT]
max-line-length = 120

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "R0903", # too-many-instance-attributes
    "R0902", # too-many-instance-attributes
    "W0718", # broad-exception-caught
    "C0301", # line-too-long
    "C0103", # invalid-name
    "R0915", # too-many-statements
    "R0913", # too-many-arguments
]

# Permitir módulos compilados em C
extension-pkg-allow-list = [
    "win32api",
    "win32gui",
    "win32process",
    "win32con",
    "pywintypes"
]
