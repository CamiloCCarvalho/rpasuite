[project]
name = "rpa_suite"
version = "1.9.0"
description = "Comprehensive Python toolkit for RPA automation: email, logging, database tracking, browser automation, OCR, desktop automation, and more. Essential utilities for building robust automation workflows with Selenium, Botcity, and custom solutions."
readme = "README.md"
authors = [
    { name = "CamiloCarvalho", email = "camilo.costa1993@gmail.com" }
]
requires-python = ">=3.11"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.black]
line-length = 120

[tool.pylint.FORMAT]
max-line-length = 120

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "C0115", # missing-class-docstring
    "C0116", # missing-function-docstring
    "R0903", # too-many-instance-attributes
    "R0902", # too-many-instance-attributes
    "W0718", # broad-exception-caught
    "C0301", # line-too-long
    "C0103", # invalid-name
    "R0915", # too-many-statements
    "R0913", # too-many-arguments
]

# Permitir módulos compilados em C
extension-pkg-allow-list = [
    "win32api",
    "win32gui",
    "win32process",
    "win32con",
    "pywintypes"
]
